name: Deploy infraestrutura Supabase

# Dispara só quando alguém clica em "Run workflow" na aba Actions do
# GitHub — nunca automaticamente em cada push, porque isso mexe direto
# no banco de dados de produção do FIDE ONE.
on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Também rodar o seed de dados de exemplo (clientes, projetos, tarefas, conteúdos, eventos)?"
        type: boolean
        default: true
      run_rls_tests:
        description: "Rodar os testes de isolamento entre organizações depois de aplicar tudo?"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+ é obrigatório: @supabase/realtime-js (dependência de
          # @supabase/supabase-js, usado em scripts/deploy/create-users.mjs)
          # espera o global WebSocket nativo do runtime — só existe a
          # partir do Node 22 — e lança erro na hora de criar o client
          # (createClient()) em qualquer versão anterior, mesmo sem usar
          # nenhum recurso de Realtime.
          node-version: 22

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Instalar cliente do Postgres (psql)
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Instalar Supabase CLI
        run: npm install -g supabase

      # ============================================================
      # INFRAESTRUTURA — migrations, RLS, Storage, organização,
      # verificação. Isto é o que faz o FIDE ONE funcionar; nada aqui
      # deve depender de e-mail, envio de convite ou qualquer serviço
      # externo além do próprio Postgres do Supabase.
      # ============================================================

      - name: Montar a string de conexão (senha isolada, sem risco de erro de codificação)
        id: dbconn
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # A senha nunca é colada dentro de uma URL por um humano — isso é
          # exatamente o que causou o erro anterior (um caractere especial
          # da senha, como "@", quebrando a leitura do endereço). Aqui o
          # próprio workflow codifica a senha corretamente antes de montar
          # a string de conexão, então qualquer caractere na senha é seguro.
          if [ -z "$SUPABASE_DB_HOST" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltam os Secrets SUPABASE_DB_HOST e/ou SUPABASE_DB_PASSWORD. Veja docs/supabase-deployment.md." >&2
            exit 1
          fi

          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://##; s#\.supabase\.co/?$##')
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))")
          DB_URL="postgresql://postgres.${PROJECT_REF}:${ENCODED_PASSWORD}@${SUPABASE_DB_HOST}:5432/postgres"

          echo "::add-mask::$ENCODED_PASSWORD"
          echo "::add-mask::$DB_URL"
          echo "url=$DB_URL" >> "$GITHUB_OUTPUT"

      - name: Aplicar as 13 migrations no banco hospedado
        env:
          SUPABASE_DB_URL: ${{ steps.dbconn.outputs.url }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes --workdir .

      - name: Criar a organização "Fide Comunicação" (se ainda não existir)
        env:
          SUPABASE_DB_URL: ${{ steps.dbconn.outputs.url }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
            "insert into public.organizations (name, slug) values ('Fide Comunicação', 'fide') on conflict (slug) do nothing;"

      # ============================================================
      # DADOS DE DESENVOLVIMENTO — usuários fictícios + clientes/
      # projetos/tarefas/conteúdos/eventos de exemplo. Nada aqui é
      # infraestrutura: se algum item desta seção não completar (ex.:
      # limite de e-mail do Supabase), a infraestrutura acima já está
      # aplicada e válida de qualquer forma. scripts/deploy/create-users.mjs
      # nunca falha o workflow por causa de um limite de e-mail — só por
      # um erro genuinamente inesperado.
      # ============================================================

      - name: Convidar os 5 usuários de desenvolvimento por e-mail
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/deploy/create-users.mjs

      - name: Rodar o seed de dados de desenvolvimento
        if: ${{ inputs.run_seed }}
        env:
          SUPABASE_DB_URL: ${{ steps.dbconn.outputs.url }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/manual/seed-hosted.sql

      # ============================================================
      # De volta para INFRAESTRUTURA: estes dois conferem o estado do
      # banco (RLS, tabelas, policies, buckets) — não dependem de
      # nenhum usuário/dado de desenvolvimento ter sido criado.
      # ============================================================

      - name: Rodar os testes de isolamento entre organizações (RLS)
        if: ${{ inputs.run_rls_tests }}
        env:
          SUPABASE_DB_URL: ${{ steps.dbconn.outputs.url }}
        run: |
          {
            echo "## Testes de RLS (isolamento entre organizações)"
            echo '```'
            psql "$SUPABASE_DB_URL" -f supabase/manual/rls-tests.sql 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conferir estrutura final (tabelas, RLS, policies, Storage)
        env:
          SUPABASE_DB_URL: ${{ steps.dbconn.outputs.url }}
        run: |
          {
            echo "## Verificação final da estrutura"
            echo '```'
            psql "$SUPABASE_DB_URL" -f supabase/manual/verification.sql 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo em linguagem simples (role até aqui primeiro)
        if: always()
        env:
          SUPABASE_DB_URL: ${{ steps.dbconn.outputs.url }}
        run: |
          TABLES=$(psql "$SUPABASE_DB_URL" -t -A -c "select count(*) from information_schema.tables where table_schema='public';")
          RLS_ON=$(psql "$SUPABASE_DB_URL" -t -A -c "select count(*) from pg_tables where schemaname='public' and rowsecurity=true;")
          BUCKETS=$(psql "$SUPABASE_DB_URL" -t -A -c "select count(*) from storage.buckets;")
          ORG=$(psql "$SUPABASE_DB_URL" -t -A -c "select count(*) from public.organizations where slug='fide';")
          PROFILES=$(psql "$SUPABASE_DB_URL" -t -A -c "select count(*) from public.profiles;")

          {
            echo "## Resumo em português (leia isto primeiro)"
            echo ""
            echo "**Infraestrutura** (o que faz o FIDE ONE funcionar):"
            if [ "$TABLES" = "19" ]; then echo "- ✅ As 19 tabelas do FIDE ONE foram criadas."; else echo "- ❌ Esperava 19 tabelas, encontrei $TABLES."; fi
            if [ "$RLS_ON" = "19" ]; then echo "- ✅ A proteção de dados por organização está ativa em todas as tabelas."; else echo "- ❌ Proteção ativa em $RLS_ON de 19 tabelas."; fi
            if [ "$BUCKETS" = "4" ]; then echo "- ✅ Os 4 espaços de armazenamento de arquivos existem."; else echo "- ❌ Esperava 4 áreas de Storage, encontrei $BUCKETS."; fi
            if [ "$ORG" = "1" ]; then echo "- ✅ A organização \"Fide Comunicação\" existe."; else echo "- ❌ A organização não foi encontrada."; fi
            echo ""
            echo "**Dados de desenvolvimento** (opcional — não afeta a infraestrutura acima):"
            if [ "${PROFILES:-0}" -ge "1" ] 2>/dev/null; then
              echo "- ✅ $PROFILES de 5 usuário(s) de exemplo já com perfil ativo (aceitaram o convite por e-mail). Veja a seção \"Convites de usuários de desenvolvimento\" acima para o detalhe de cada um."
            else
              echo "- ⚠️ Nenhum usuário de exemplo aceitou o convite ainda (ou o Supabase ainda não conseguiu enviar — veja a seção \"Convites de usuários de desenvolvimento\" acima). Isso não afeta a infraestrutura: pode rodar o resto normalmente e convidar essas pessoas depois."
            fi
            echo ""
            echo "Se algum item de **Infraestrutura** estiver com ❌, copie esta página inteira e me envie — eu identifico e corrijo. Itens de **Dados de desenvolvimento** com ⚠️ não precisam de ação imediata."
          } >> "$GITHUB_STEP_SUMMARY"
