<!doctype html>
<!--
  CONSERVAR · vertical 9:16 · tier2 · share CTA
  Paper-plane pill + arrow pointing at the Reels share button (stops at x 935, outside the UI column).
  Safe area (Reels): text in x 90..940, y 250..1540. Shared styles: ../../vertical.css
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../../vertical.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; background: transparent; }
      #share { position: absolute; left: 90px; top: 1390px; width: 850px; height: 110px; }
      #share .pill { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 18px; height: 100px; padding: 0 30px; border-radius: 50px; background: rgba(47, 58, 79, 0.95); box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
      #share .pill svg { width: 56px; height: 56px; }
      #share .pill span { font-family: var(--font-display); font-weight: var(--wt-black); font-size: 60px; }
      #share .arrow { position: absolute; left: 560px; top: 22px; width: 290px; height: 56px; }
    </style>
  </head>
  <body>
    <div id="v-share" class="cv-stage" data-composition-id="v-share" data-start="0" data-width="1080" data-height="1920">

      <div id="share">
        <div class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M22 3L2 10.5l7.5 3L12 21z"/><path d="M22 3L9.5 13.5"/></svg>
          <span>Compartilhe</span>
        </div>
        <svg class="arrow" viewBox="0 0 290 56" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path class="shaft" d="M8 28H270"/><path class="head" d="M246 8l24 20-24 20"/></svg>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      tl.from("#share", { autoAlpha: 0, x: -40, duration: 0.4 }, 0)
        .fromTo("#share .shaft", { strokeDasharray: 270, strokeDashoffset: 270 }, { strokeDashoffset: 0, duration: 0.45 }, 0.25)
        .from("#share .head", { autoAlpha: 0, x: -20, duration: 0.25 }, 0.55)
        .to("#share .arrow", { x: 12, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.95).set({}, {}, 2.2);
      window.__timelines["v-share"] = tl;
    </script>
  </body>
</html>
