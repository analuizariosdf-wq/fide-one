<!doctype html>
<!--
  CONSERVAR · vertical 9:16 · tier2 · highlight (lower-third phrase, orange words)
  Short white lead-in plus the key phrase in orange, centered in the lower third over a navy scrim.
  Safe area (Reels): text in x 90..940, y 250..1540. Shared styles: ../../vertical.css
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../../vertical.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; background: transparent; }
      .cv-title { left: 90px; width: 850px; top: 1150px; text-align: center; }
      .l1 { font-size: 62px; } .l2 { font-size: 86px; }
    </style>
  </head>
  <body>
    <div id="v-highlight" class="cv-stage" data-composition-id="v-highlight" data-start="0" data-width="1080" data-height="1920">
      <div class="cv-scrim"></div>
      <div class="cv-title"><span class="line l1" data-slot="lead">Talvez seja hora de</span>
        <span class="line l2 cv-accent" data-slot="highlight">rever essa parceria</span></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      tl.from("#v-highlight .cv-scrim", { autoAlpha: 0, duration: 0.3 }, 0)
        .from("#v-highlight .l1", { autoAlpha: 0, y: 24, duration: 0.35 }, 0)
        .from("#v-highlight .l2", { autoAlpha: 0, y: 30, duration: 0.4 }, 0.25)
        .to("#v-highlight .cv-title, #v-highlight .cv-scrim", { autoAlpha: 0, duration: 0.25 }, 2.2)
        .set({}, {}, 2.5);
      window.__timelines["v-highlight"] = tl;
    </script>
  </body>
</html>
