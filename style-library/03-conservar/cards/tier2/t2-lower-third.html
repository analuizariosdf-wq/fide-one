<!doctype html>
<!--
  CONSERVAR · tier2 · lower-third (overlay, speaker stays visible)
  Orange accent bar + white name plate + navy role strip, logo swoosh mark.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; background: transparent; }
      #t2-lower-third {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; font-family: var(--font-body);
      }
      #t2-lower-third .plate { position: absolute; left: 110px; bottom: 120px; display: flex; }
      #t2-lower-third .bar { width: 14px; border-radius: 7px; background: var(--orange); margin-right: 18px; }
      #t2-lower-third .stack { display: flex; flex-direction: column; align-items: flex-start; }
      #t2-lower-third .name {
        background: var(--white); color: var(--navy); font-family: var(--font-display);
        font-weight: var(--wt-black); font-size: 50px; line-height: 1; padding: 20px 30px 18px;
        border-radius: 14px 14px 14px 0; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      }
      #t2-lower-third .role {
        background: var(--navy); color: var(--white); font-weight: 600; font-size: 28px;
        padding: 12px 30px; border-radius: 0 0 14px 14px;
      }
      #t2-lower-third .role b { color: var(--orange); font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="t2-lower-third" data-composition-id="t2-lower-third" data-start="0" data-width="1920" data-height="1080">
      <div class="plate">
        <div class="bar"></div>
        <div class="stack">
          <div class="name" data-slot="name">Nome Sobrenome</div>
          <div class="role" data-slot="role">Diretor · <b>Conservar</b></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#t2-lower-third .bar", { scaleY: 0, transformOrigin: "bottom", duration: 0.35, ease: "power3.out" })
        .from("#t2-lower-third .name", { autoAlpha: 0, x: -40, duration: 0.45, ease: "power3.out" }, "-=0.1")
        .from("#t2-lower-third .role", { autoAlpha: 0, y: -14, duration: 0.35, ease: "power3.out" }, "-=0.2")
        .to("#t2-lower-third .plate", { autoAlpha: 0, x: -30, duration: 0.3, ease: "power2.in" }, 4.7)
        .set({}, {}, 5);
      window.__timelines["t2-lower-third"] = tl;
    </script>
  </body>
</html>
